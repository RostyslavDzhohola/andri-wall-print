<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Print Pro - Studio Darkroom</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #141416;
      --bg-tertiary: #1c1c1f;
      --text-primary: #fafafa;
      --text-secondary: #8a8a8a;
      --accent: #e85d4c;
      --accent-hover: #f06b5a;
      --border: #2a2a2d;
      --highlight: #252528;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 3rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      color: var(--text-primary);
    }

    .section-title {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .artwork-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
      overflow-y: auto;
    }

    .artwork-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem;
      border-radius: 0.625rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .artwork-item:hover {
      background: var(--highlight);
    }

    .artwork-item.active {
      background: var(--highlight);
      border-color: var(--accent);
    }

    .artwork-thumb {
      width: 48px;
      height: 48px;
      border-radius: 0.375rem;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-tertiary);
    }

    .artwork-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .artwork-info {
      flex: 1;
      min-width: 0;
    }

    .artwork-name {
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artwork-specs {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .user-details {
      flex: 1;
    }

    .user-name {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .user-role {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .main {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .top-actions {
      display: flex;
      gap: 0.75rem;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 0.625rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--highlight);
      color: var(--text-primary);
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
    }

    .content {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .preview-stage {
      flex: 1;
      background: var(--bg-secondary);
      border-radius: 1rem;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 500px;
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .stage-label {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .stage-actions {
      display: flex;
      gap: 0.5rem;
    }

    .stage-badge {
      padding: 0.375rem 0.75rem;
      background: var(--highlight);
      border-radius: 0.25rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .stage-viewport {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .wall-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, var(--border) 1px, transparent 1px),
        linear-gradient(to bottom, var(--border) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.3;
    }

    .artwork-frame {
      position: relative;
      z-index: 1;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .artwork-frame img {
      max-height: 450px;
      width: auto;
      max-width: 100%;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.5);
      border-radius: 0.25rem;
    }

    .artwork-frame.scale-in {
      animation: scaleIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.95);
        opacity: 0.8;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .measurement-overlay {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-tertiary);
      padding: 0.625rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }

    .measurement-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .info-panel {
      background: var(--bg-secondary);
      border-radius: 1rem;
      border: 1px solid var(--border);
      padding: 1.5rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }

    .info-cell {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .info-label {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
    }

    .info-value {
      font-size: 1rem;
      font-weight: 500;
    }

    .info-value.large {
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.5rem;
    }

    .btn-ar-primary {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2rem;
      background: var(--accent);
      color: var(--text-primary);
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-ar-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(232, 93, 76, 0.25);
    }

    .btn-ar-primary svg {
      width: 22px;
      height: 22px;
    }

    .btn-secondary-dark {
      padding: 1rem 1.5rem;
      background: var(--highlight);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary-dark:hover {
      background: var(--bg-tertiary);
    }

    @media (max-width: 1200px) {
      .app {
        grid-template-columns: 240px 1fr;
      }

      .info-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .content {
        padding: 1rem;
      }

      .preview-stage {
        min-height: 400px;
      }

      .artwork-frame img {
        max-height: 300px;
      }

      .action-bar {
        flex-direction: column;
        gap: 1rem;
      }

      .btn-ar-primary, .btn-secondary-dark {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
        </div>
        Wall Print Pro
      </div>

      <div class="section-title">Collection</div>
      <nav class="artwork-list" id="artwork-list"></nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">JD</div>
          <div class="user-details">
            <div class="user-name">John Doe</div>
            <div class="user-role">Interior Designer</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="top-bar">
        <h1 class="page-title">Preview Studio</h1>
        <div class="top-actions">
          <button class="btn-icon" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v6m0 6v6m4.22-10.22l4.24-4.24M6.34 17.66l-4.24 4.24M23 12h-6m-6 0H1m20.24 4.24l-4.24-4.24M6.34 6.34L2.1 2.1"/>
            </svg>
          </button>
          <button class="btn-icon" aria-label="Help">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
              <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="content">
        <div class="preview-stage">
          <div class="stage-header">
            <span class="stage-label">Wall Preview</span>
            <div class="stage-actions">
              <span class="stage-badge">True Size</span>
              <span class="stage-badge" id="aspect-badge">60x50</span>
            </div>
          </div>
          <div class="stage-viewport">
            <div class="wall-grid"></div>
            <div class="artwork-frame" id="artwork-frame">
              <img src="../../../public/artworks/chicago-final-1.png" alt="Artwork" id="main-image">
            </div>
            <div class="measurement-overlay">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
              </svg>
              <span>Actual size:</span>
              <span class="measurement-value" id="measurement-value">5'0" x 4'2"</span>
            </div>
          </div>
        </div>

        <div class="info-panel">
          <div class="info-grid">
            <div class="info-cell">
              <span class="info-label">Artwork</span>
              <span class="info-value large" id="info-title">Chicago Final 1</span>
            </div>
            <div class="info-cell">
              <span class="info-label">Dimensions</span>
              <span class="info-value" id="info-dimensions">60 x 50 inches</span>
            </div>
            <div class="info-cell">
              <span class="info-label">Material</span>
              <span class="info-value">Premium Canvas</span>
            </div>
            <div class="info-cell">
              <span class="info-label">Reference</span>
              <span class="info-value">WPP-2024-001</span>
            </div>
          </div>
        </div>

        <div class="action-bar">
          <button class="btn-secondary-dark">Download Spec Sheet</button>
          <button class="btn-ar-primary" id="ar-button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            Launch AR Preview
          </button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const artworks = [
      {
        id: "chicago-final-1",
        title: "Chicago Final 1",
        dimensions: "60 x 50 inches",
        size: "5'0\" x 4'2\"",
        aspect: "60x50",
        image: "../../../public/artworks/chicago-final-1.png",
        arUrl: "../../../public/ar/chicago-final-1.usdz"
      },
      {
        id: "chicago-final-2",
        title: "Chicago Final 2",
        dimensions: "36 x 60 inches",
        size: "3'0\" x 5'0\"",
        aspect: "36x60",
        image: "../../../public/artworks/chicago-final-2.png",
        arUrl: "../../../public/ar/chicago-final-2.usdz"
      },
      {
        id: "chicago-final-3",
        title: "Chicago Final 3",
        dimensions: "48 x 60 inches",
        size: "4'0\" x 5'0\"",
        aspect: "48x60",
        image: "../../../public/artworks/chicago-final-3.png",
        arUrl: "../../../public/ar/chicago-final-3.usdz"
      },
      {
        id: "dragon-wall-print",
        title: "Dragon Wall Print",
        dimensions: "45 x 90 cm",
        size: "1'6\" x 2'11\"",
        aspect: "45x90",
        image: "../../../public/artworks/dragon-wall-print.png",
        arUrl: "../../../public/ar/dragon-wall-print.usdz"
      },
      {
        id: "elven-wall-print",
        title: "Elven Portrait",
        dimensions: "45 x 90 cm",
        size: "1'6\" x 2'11\"",
        aspect: "45x90",
        image: "../../../public/artworks/elven-wall-print.png",
        arUrl: "../../../public/ar/elven-wall-print.usdz"
      },
      {
        id: "cyberpunk-wall-print",
        title: "Cyberpunk Skyline",
        dimensions: "45 x 90 cm",
        size: "1'6\" x 2'11\"",
        aspect: "45x90",
        image: "../../../public/artworks/cyberpunk-wall-print.png",
        arUrl: "../../../public/ar/cyberpunk-wall-print.usdz"
      }
    ];

    let selectedIndex = 0;

    const artworkList = document.getElementById('artwork-list');
    const mainImage = document.getElementById('main-image');
    const artworkFrame = document.getElementById('artwork-frame');
    const infoTitle = document.getElementById('info-title');
    const infoDimensions = document.getElementById('info-dimensions');
    const measurementValue = document.getElementById('measurement-value');
    const aspectBadge = document.getElementById('aspect-badge');
    const arButton = document.getElementById('ar-button');

    function renderArtworkList() {
      artworkList.innerHTML = artworks.map((artwork, index) => `
        <div class="artwork-item ${index === selectedIndex ? 'active' : ''}" data-index="${index}">
          <div class="artwork-thumb">
            <img src="${artwork.image}" alt="${artwork.title}">
          </div>
          <div class="artwork-info">
            <div class="artwork-name">${artwork.title}</div>
            <div class="artwork-specs">${artwork.dimensions}</div>
          </div>
        </div>
      `).join('');

      artworkList.querySelectorAll('.artwork-item').forEach(item => {
        item.addEventListener('click', () => {
          selectArtwork(parseInt(item.dataset.index));
        });
      });
    }

    function selectArtwork(index) {
      if (index === selectedIndex) return;

      selectedIndex = index;
      const artwork = artworks[index];

      artworkFrame.classList.add('scale-in');

      mainImage.src = artwork.image;
      mainImage.alt = artwork.title;
      infoTitle.textContent = artwork.title;
      infoDimensions.textContent = artwork.dimensions;
      measurementValue.textContent = artwork.size;
      aspectBadge.textContent = artwork.aspect;

      renderArtworkList();

      setTimeout(() => {
        artworkFrame.classList.remove('scale-in');
      }, 400);
    }

    arButton.addEventListener('click', () => {
      const artwork = artworks[selectedIndex];
      alert(`Launching AR preview for: ${artwork.title}\nDimensions: ${artwork.dimensions}\n\nOn iOS: Opens USDZ in Quick Look\nOn Android: Opens Scene Viewer`);
    });

    renderArtworkList();
  </script>
</body>
</html>
