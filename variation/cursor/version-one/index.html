<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Print Pro - Minimal Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #faf9f7;
      --bg-secondary: #f0eeeb;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --accent: #c4a77d;
      --accent-hover: #b3966c;
      --border: #e5e2de;
      --white: #ffffff;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.9375rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .btn-secondary {
      padding: 0.625rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 2rem;
      background: var(--white);
      color: var(--text-primary);
      font-size: 0.9375rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      border-color: var(--text-secondary);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 4rem;
      align-items: start;
    }

    .content-side {
      position: sticky;
      top: 2rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }

    .intro {
      font-size: 1.125rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .artwork-meta {
      padding: 1.5rem;
      background: var(--white);
      border-radius: 0.75rem;
      box-shadow: var(--shadow);
    }

    .meta-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .meta-value {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 1.25rem;
    }

    .meta-value:last-child {
      margin-bottom: 0;
    }

    .preview-area {
      background: var(--bg-secondary);
      border-radius: 1rem;
      padding: 3rem;
      position: relative;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .room-bg {
      position: absolute;
      inset: 0;
      opacity: 0.4;
      pointer-events: none;
    }

    .room-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1rem;
    }

    .artwork-display {
      position: relative;
      z-index: 1;
      max-width: 100%;
      transition: opacity 0.4s ease;
    }

    .artwork-display img {
      max-height: 480px;
      width: auto;
      max-width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      border-radius: 0.25rem;
    }

    .artwork-display.fade-out {
      opacity: 0;
    }

    .thumbnails {
      display: flex;
      gap: 0.75rem;
      margin-top: 2rem;
      z-index: 1;
      padding: 0.5rem;
      background: var(--white);
      border-radius: 0.5rem;
      box-shadow: var(--shadow);
    }

    .thumb {
      width: 64px;
      height: 64px;
      border-radius: 0.375rem;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      opacity: 0.6;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb:hover {
      opacity: 0.85;
    }

    .thumb.active {
      border-color: var(--accent);
      opacity: 1;
    }

    .action-bar {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      align-items: center;
      background: var(--white);
      padding: 1rem 1.5rem;
      border-radius: 3rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      z-index: 10;
    }

    .action-info {
      padding-right: 1rem;
      border-right: 1px solid var(--border);
    }

    .action-title {
      font-weight: 600;
      font-size: 0.9375rem;
    }

    .action-dimensions {
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }

    .btn-ar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 2rem;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-ar:hover {
      background: var(--accent-hover);
    }

    .ar-icon {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 1024px) {
      main {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .content-side {
        position: static;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
      }

      .artwork-meta {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        text-align: left;
      }

      .meta-value {
        margin-bottom: 0;
      }

      .preview-area {
        padding: 2rem;
        min-height: 400px;
      }

      .action-bar {
        bottom: 1rem;
        left: 1rem;
        right: 1rem;
        transform: none;
        border-radius: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      .container {
        padding: 1rem;
      }

      header {
        margin-bottom: 1.5rem;
      }

      .nav-links {
        gap: 1rem;
      }

      .nav-links a:not(.btn-secondary) {
        display: none;
      }

      h1 {
        font-size: 1.75rem;
      }

      .artwork-meta {
        grid-template-columns: 1fr;
      }

      .thumbnails {
        gap: 0.5rem;
      }

      .thumb {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">Wall Print <span>Pro</span></div>
      <nav class="nav-links">
        <a href="#gallery">Gallery</a>
        <a href="#about">About</a>
        <button class="btn-secondary">Sign in</button>
      </nav>
    </header>

    <main>
      <section class="content-side">
        <h1>See it on your wall before you buy.</h1>
        <p class="intro">Choose artwork, open the wall preview on your phone, and place it at true size in the space where it will hang.</p>
        
        <div class="artwork-meta">
          <div>
            <div class="meta-label">Selected</div>
            <div class="meta-value" id="meta-title">Chicago Final 1</div>
          </div>
          <div>
            <div class="meta-label">Dimensions</div>
            <div class="meta-value" id="meta-size">5'0" x 4'2"</div>
          </div>
          <div>
            <div class="meta-label">Material</div>
            <div class="meta-value">Canvas Print</div>
          </div>
        </div>
      </section>

      <section class="preview-area">
        <div class="room-bg">
          <img src="../../../public/wall-room.svg" alt="Room background">
        </div>
        
        <div class="artwork-display" id="artwork-display">
          <img src="../../../public/artworks/chicago-final-1.png" alt="Chicago Final 1" id="main-image">
        </div>

        <div class="thumbnails" id="thumbnails"></div>
      </section>
    </main>

    <div class="action-bar">
      <div class="action-info">
        <div class="action-title" id="action-title">Chicago Final 1</div>
        <div class="action-dimensions" id="action-dimensions">5'0" wide x 4'2" tall</div>
      </div>
      <button class="btn-ar" id="ar-button">
        <svg class="ar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        View in AR
      </button>
    </div>
  </div>

  <script>
    const artworks = [
      {
        id: "chicago-final-1",
        title: "Chicago Final 1",
        size: "5'0\" x 4'2\"",
        width: "5'0\"",
        height: "4'2\"",
        image: "../../../public/artworks/chicago-final-1.png",
        arUrl: "../../../public/ar/chicago-final-1.usdz"
      },
      {
        id: "chicago-final-2",
        title: "Chicago Final 2",
        size: "3'0\" x 5'0\"",
        width: "3'0\"",
        height: "5'0\"",
        image: "../../../public/artworks/chicago-final-2.png",
        arUrl: "../../../public/ar/chicago-final-2.usdz"
      },
      {
        id: "chicago-final-3",
        title: "Chicago Final 3",
        size: "4'0\" x 5'0\"",
        width: "4'0\"",
        height: "5'0\"",
        image: "../../../public/artworks/chicago-final-3.png",
        arUrl: "../../../public/ar/chicago-final-3.usdz"
      },
      {
        id: "dragon-wall-print",
        title: "Dragon Wall Print",
        size: "1'6\" x 2'11\"",
        width: "1'6\"",
        height: "2'11\"",
        image: "../../../public/artworks/dragon-wall-print.png",
        arUrl: "../../../public/ar/dragon-wall-print.usdz"
      },
      {
        id: "elven-wall-print",
        title: "Elven Portrait",
        size: "1'6\" x 2'11\"",
        width: "1'6\"",
        height: "2'11\"",
        image: "../../../public/artworks/elven-wall-print.png",
        arUrl: "../../../public/ar/elven-wall-print.usdz"
      },
      {
        id: "cyberpunk-wall-print",
        title: "Cyberpunk Skyline",
        size: "1'6\" x 2'11\"",
        width: "1'6\"",
        height: "2'11\"",
        image: "../../../public/artworks/cyberpunk-wall-print.png",
        arUrl: "../../../public/ar/cyberpunk-wall-print.usdz"
      }
    ];

    let selectedIndex = 0;

    const mainImage = document.getElementById('main-image');
    const artworkDisplay = document.getElementById('artwork-display');
    const metaTitle = document.getElementById('meta-title');
    const metaSize = document.getElementById('meta-size');
    const actionTitle = document.getElementById('action-title');
    const actionDimensions = document.getElementById('action-dimensions');
    const thumbnailsContainer = document.getElementById('thumbnails');
    const arButton = document.getElementById('ar-button');

    function renderThumbnails() {
      thumbnailsContainer.innerHTML = artworks.map((artwork, index) => `
        <div class="thumb ${index === selectedIndex ? 'active' : ''}" data-index="${index}">
          <img src="${artwork.image}" alt="${artwork.title}">
        </div>
      `).join('');

      thumbnailsContainer.querySelectorAll('.thumb').forEach(thumb => {
        thumb.addEventListener('click', () => {
          selectArtwork(parseInt(thumb.dataset.index));
        });
      });
    }

    function selectArtwork(index) {
      if (index === selectedIndex) return;

      artworkDisplay.classList.add('fade-out');

      setTimeout(() => {
        selectedIndex = index;
        const artwork = artworks[index];

        mainImage.src = artwork.image;
        mainImage.alt = artwork.title;
        metaTitle.textContent = artwork.title;
        metaSize.textContent = artwork.size;
        actionTitle.textContent = artwork.title;
        actionDimensions.textContent = `${artwork.width} wide x ${artwork.height} tall`;

        renderThumbnails();

        artworkDisplay.classList.remove('fade-out');
      }, 200);
    }

    arButton.addEventListener('click', () => {
      const artwork = artworks[selectedIndex];
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      
      if (isIOS) {
        window.location.href = artwork.arUrl;
      } else {
        alert('AR preview requires iPhone Safari or Android Chrome with AR support.\n\nOn iPhone, this would open the USDZ file in Quick Look.\nOn Android, this would launch Scene Viewer.');
      }
    });

    renderThumbnails();
  </script>
</body>
</html>
