<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variation screenshot contact sheet</title>
<style>
body{margin:0;background:#111;color:#f5f5f5;font-family:Inter,ui-sans-serif,system-ui,sans-serif;padding:18px}
h1{margin:0 0 16px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
figure{margin:0;background:#222;border:1px solid #444;padding:10px}
figcaption{font-weight:800;margin:0 0 8px;font-size:14px}
img{display:block;width:100%;height:360px;object-fit:cover;object-position:top;border:1px solid #333;background:#fff}
</style>
</head>
<body>
<h1>Wall Print Pro design variation screenshots</h1>
<div class="grid">
<figure><figcaption>Codex 1</figcaption><img src="variation--codex--version-one--index.png" alt="Codex 1 screenshot"></figure>
<figure><figcaption>Codex 2</figcaption><img src="variation--codex--version-two--index.png" alt="Codex 2 screenshot"></figure>
<figure><figcaption>Codex 3</figcaption><img src="variation--codex--version-three--index.png" alt="Codex 3 screenshot"></figure>
<figure><figcaption>Codex 4</figcaption><img src="variation--codex--version-four--index.png" alt="Codex 4 screenshot"></figure>
<figure><figcaption>Codex 5</figcaption><img src="variation--codex--version-five--index.png" alt="Codex 5 screenshot"></figure>
<figure><figcaption>Cursor 1</figcaption><img src="variation--cursor--version-one--index.png" alt="Cursor 1 screenshot"></figure>
<figure><figcaption>Cursor 2</figcaption><img src="variation--cursor--version-two--index.png" alt="Cursor 2 screenshot"></figure>
<figure><figcaption>Cursor 3</figcaption><img src="variation--cursor--version-three--index.png" alt="Cursor 3 screenshot"></figure>
<figure><figcaption>Cursor 4</figcaption><img src="variation--cursor--version-four--index.png" alt="Cursor 4 screenshot"></figure>
<figure><figcaption>Cursor 5</figcaption><img src="variation--cursor--version-five--index.png" alt="Cursor 5 screenshot"></figure>
</div>
</body>
</html>
